<form [formGroup]="departmentForm" class="department-form">
    <h2>Add Department</h2>

    <label>
        Department Name <span class="required">*</span>
    </label>

    <input type="text" formControlName="departmentName">

    <div class="error" *ngIf="departmentName?.touched">

        <span *ngIf="departmentName?.errors?.['required']">
            Department Name is required
        </span>

        <span *ngIf="departmentName?.errors?.['maxlength']">
            Maximum 20 characters
        </span>

        <span *ngIf="departmentName?.errors?.['pattern']">
            Only alphabets are allowed.
        </span>

        <span *ngIf="departmentName?.errors?.['consecutiveSpaces']">
            Only a single space is allowed between words.
          </span>

          <span *ngIf="departmentName?.errors?.['duplicate']">
            Department name already exists.
          </span>
    </div>

    <div class="form-actions">
        <button class="btn add-btn form-btn" type="button" (click)="adddepartment()">save</button>
        <button type="button" class="btn btn-close form-btn" (click)="closeForm()">Close</button>
    </div>
</form>
