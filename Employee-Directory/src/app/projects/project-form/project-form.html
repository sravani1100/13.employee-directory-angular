<form [formGroup]="projectForm" class="project-form">
    <h2>Add Project</h2>

    <label>
        Project Name <span class="required">*</span>
    </label>

    <input type="text" formControlName="projectName">

    <div class="error" *ngIf="projectName?.touched">

        <span *ngIf="projectName?.errors?.['required']">
            Project Name is required
        </span>

        <span *ngIf="projectName?.errors?.['maxlength']">
            Maximum 20 characters
        </span>

        <span *ngIf="projectName?.errors?.['pattern']">
            Only alphabets are allowed.
        </span>

        <span *ngIf="projectName?.errors?.['consecutiveSpaces']">
            Only a single space is allowed between words.
          </span>

          <span *ngIf="projectName?.errors?.['duplicate']">
            Project name already exists.
          </span>
    </div>

    <div class="form-actions">
        <button class="btn add-btn form-btn" type="button" (click)="addProject()">save</button>
        <button type="button" class="btn btn-close form-btn" (click)="closeForm()">Close</button>
    </div>
</form>
