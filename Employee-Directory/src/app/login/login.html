<div class="login-container">

  <div class="login-card">

    <h2>
      Login
    </h2>

    <div class="form-group">

      <label>
        Username
      </label>

      <input
        type="text"
        [(ngModel)]="loginData.userName"
        placeholder="Enter username">

    </div>

    <div class="form-group">

      <label>
        Password
      </label>

      <input
        type="password"
        [(ngModel)]="loginData.password"
        placeholder="Enter password">

    </div>

    <button
      class="login-btn"
      (click)="login()">

      Login

    </button>

  </div>

</div>
